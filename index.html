<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marina — інтернет-магазин одягу</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#d1d8e3;--blue:#2a4d94;--navy:#1e3a78;--org:#ff6b2c;--ok:#1f9d63;--red:#e5383b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1b2434;--ink:#f1f5f9;--mute:#9ca3af;--line:#334155;--navy:#9db8ff}}
:root[data-theme="dark"]{--bg:#111827;--card:#1b2434;--ink:#f1f5f9;--mute:#9ca3af;--line:#334155;--navy:#9db8ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(14px,4vw,40px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-size:28px;font-weight:800}
.cartb{background:var(--org);color:#fff;border:0;border-radius:99px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.badge{background:var(--red);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 6px}
main{max-width:1100px;margin:0 auto;padding:18px clamp(14px,4vw,40px) 50px}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:18px}
.tools select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--blue);margin:0;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(30,58,120,.1);display:flex;flex-direction:column}
.pic{position:relative;aspect-ratio:4/3}
.pic svg{width:100%;height:100%;display:block}
.tag{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-size:20px}
.sub{color:var(--mute);font-size:14px}
.price{font-size:23px;font-weight:800;color:var(--navy)}.price s{font-size:14px;font-weight:400;color:var(--mute);margin-left:8px}
select.sz{padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
.add{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);color:#fff;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;font-size:15px}
.add input{accent-color:#fff}
.add.on{background:var(--ok)}
.add:has(:focus-visible),.cartb:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.sm{width:auto;padding:8px 12px;margin:0;font-weight:500}
.empty{color:var(--mute);padding:26px 0}
dialog{width:min(560px,calc(100% - 20px));max-height:92vh;border:0;border-radius:22px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(10,20,40,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 22px 6px}
.dh h2{margin:0;font-size:26px;color:var(--navy);line-height:1.2}
.x{border:0;background:var(--bg);color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;flex:none}
.db{padding:10px 22px 24px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.row small{color:var(--mute)}
.q{display:flex;align-items:center;gap:10px}
.q button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:16px 0;color:var(--navy)}
.f{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.f label,.lg{font-weight:700}
.f input,.f textarea{padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:8px 0 14px}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
.err{color:var(--red);font-size:14px;min-height:20px}
.ok{text-align:center;padding:20px 0}.ok h2{color:var(--navy)}
</style>
</head>
<body>
<header>
  <div class="logo">👗 Marina</div>
  <button class="cartb" id="open" type="button">🛒 Кошик <span class="badge" id="cnt">0</span></button>
</header>
<main>
  <div class="tools">
    <label>Категорія:
      <select id="cat"><option value="">Усе</option><option>Футболки</option><option>Верхній одяг</option><option>Штани</option><option>Сукні та спідниці</option><option>Шорти</option><option>Взуття</option><option>Аксесуари</option></select>
    </label>
    <label class="chk"><input type="checkbox" id="saleOnly"> Лише зі знижкою</label>
    <label class="chk"><input type="checkbox" id="inCartOnly"> Лише в кошику</label>
  </div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="dlg">
  <div class="dh"><h2 id="dtitle">🛒 Кошик</h2><button class="x" id="close" type="button" aria-label="Закрити">✕</button></div>
  <div class="db" id="dbody"></div>
</dialog>
<script>
var P=[
 {id:1,n:"Футболка «Ранок»",d:"Бавовна 100%, вільний крій",c:"Футболки",p:650,o:0,col:"#f2b632",bg:"#fdf1d3",k:"tee",s:["S","M","L","XL"]},
 {id:2,n:"Футболка «Море»",d:"Бавовна, щільний трикотаж",c:"Футболки",p:700,o:900,col:"#3f9ac4",bg:"#d9eef8",k:"tee",s:["S","M","L","XL"]},
 {id:3,n:"Худі «Сірий дим»",d:"Фліс, кишеня-кенгуру",c:"Верхній одяг",p:1650,o:0,col:"#7d8791",bg:"#e4e8ec",k:"hood",s:["S","M","L","XL"]},
 {id:4,n:"Худі «Ліс»",d:"Тепле, з капюшоном",c:"Верхній одяг",p:2400,o:3200,col:"#2f6b4f",bg:"#d8eadf",k:"hood",s:["M","L","XL"]},
 {id:5,n:"Джинси «Прямі»",d:"Класичний крій, високий пояс",c:"Штани",p:1450,o:0,col:"#3a55a0",bg:"#dbe3f5",k:"pants",s:["28","30","32","34"]},
 {id:6,n:"Штани «Карго»",d:"Бавовна, великі кишені",c:"Штани",p:1300,o:1700,col:"#8f7d4e",bg:"#efe8d3",k:"pants",s:["28","30","32","34"]},
 {id:7,n:"Шапка «Вовна»",d:"М’яка в’язка, на флісі",c:"Аксесуари",p:420,o:0,col:"#d1583a",bg:"#fbe1d9",k:"hat",s:["Один розмір"]},
 {id:8,n:"Шарф «Клітина»",d:"Вовна, 180 см",c:"Аксесуари",p:380,o:550,col:"#7a52a3",bg:"#e9dff4",k:"scarf",s:["Один розмір"]},
 {id:9,n:"Сукня «Лаванда»",d:"Легка, з поясом, довжина міді",c:"Сукні та спідниці",p:1850,o:2300,col:"#9b7fd1",bg:"#ece5f8",k:"dress",s:["XS","S","M","L"]},
 {id:10,n:"Сукня «Вишня»",d:"Віскоза, розкльошена",c:"Сукні та спідниці",p:1650,o:0,col:"#b02a4a",bg:"#f7dde3",k:"dress",s:["XS","S","M","L"]},
 {id:11,n:"Спідниця «Міді»",d:"Плісе, еластичний пояс",c:"Сукні та спідниці",p:990,o:0,col:"#2f7f78",bg:"#d9eeec",k:"skirt",s:["XS","S","M","L"]},
 {id:12,n:"Шорти «Літо»",d:"Льон і бавовна",c:"Шорти",p:780,o:980,col:"#e0875a",bg:"#fbe6da",k:"shorts",s:["S","M","L","XL"]},
 {id:13,n:"Кросівки «Хмара»",d:"Легка підошва, сітка",c:"Взуття",p:2100,o:0,col:"#c3cddb",bg:"#eef2f7",k:"shoe",s:["36","38","40","42"]},
 {id:14,n:"Черевики «Осінь»",d:"Екошкіра, утеплені",c:"Взуття",p:2900,o:3600,col:"#8a5a3a",bg:"#f1e4d9",k:"shoe",s:["36","38","40","42"]},
 {id:15,n:"Сумка «Місто»",d:"Екошкіра, на блискавці",c:"Аксесуари",p:1250,o:0,col:"#2d3748",bg:"#dfe3ea",k:"bag",s:["Один розмір"]},
 {id:16,n:"Сумка «Шопер»",d:"Щільна тканина, містка",c:"Аксесуари",p:450,o:600,col:"#d8b46a",bg:"#f7edd3",k:"bag",s:["Один розмір"]}
];
var D='fill="#000" opacity=".14"',L='fill="none" stroke="#000" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"';
var SH={
 dress:'<path d="M78 14l12 6c6 6 14 6 20 0l12-6 8 28-12 14 36 72H46l36-72-12-14z"/><path d="M74 56h52l-2 8H76z" '+D+'/><path d="M82 82l-16 38M100 68v54M118 82l16 38" '+L+'/>',
 skirt:'<path d="M70 30h60l30 88q-60 14-120 0z"/><rect x="70" y="30" width="60" height="12" '+D+'/><path d="M84 50l-14 62M100 48v66M116 50l14 62" '+L+'/>',
 shorts:'<path d="M60 30h80l12 76h-44l-8-34-8 34H48z"/><rect x="60" y="30" width="80" height="12" '+D+'/><path d="M100 42v30M62 98h34M138 98h-34" '+L+'/>',
 shoe:'<path d="M32 104V88c0-12 8-18 20-20l14-4c6-10 10-20 14-26l12 12c8 8 20 14 38 18 14 4 22 8 22 22v14z"/><path d="M26 104h142v12a6 6 0 01-6 6H32a6 6 0 01-6-6z" fill="#fff" opacity=".92"/><path d="M84 62l10 8M94 54l10 8M104 60l10 8" '+L+'/>',
 bag:'<path d="M60 56h80l10 70H50z"/><path d="M78 56v-8a22 22 0 0144 0v8" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="6" stroke-linecap="round"/><rect x="60" y="56" width="80" height="22" '+D+'/><circle cx="100" cy="84" r="5" fill="#fff" opacity=".8"/>',
 tee:'<path d="M62 22l26-10c5 9 19 9 24 0l26 10 22 30-22 14-8-10v66H70V56l-8 10-22-14z"/><path d="M88 12c5 11 19 11 24 0l-4-3c-4 6-12 6-16 0z" '+D+'/><path d="M70 56v66h20z" '+D+'/><path d="M82 90q10 6 22 0M120 70q-6 14 0 30" '+L+'/>',
 hood:'<path d="M58 30l26-12h32l26 12 24 60-22 8-6-18v54H62V80l-6 18-22-8z"/><path d="M84 18c0 22 32 22 32 0-6-10-26-10-32 0z" '+D+'/><path d="M92 40v26M108 40v26" '+L+'/><path d="M76 112h48l8 16H68z" '+D+'/><path d="M62 128h76" '+L+'/><path d="M56 98l-22-8M144 98l22-8" '+L+'/>',
 pants:'<path d="M66 14h68l10 120h-34l-10-80-10 80H56z"/><rect x="66" y="14" width="68" height="12" '+D+'/><path d="M100 26v28" '+L+'/><path d="M72 34q10 6 18 0M128 34q-10 6-18 0" '+L+'/><path d="M66 120h34M140 120h-30" '+L+'/>',
 hat:'<path d="M54 98a46 46 0 0192 0z"/><rect x="48" y="96" width="104" height="30" rx="8" '+D+'/><path d="M64 98v28M80 98v28M96 98v28M112 98v28M128 98v28M144 98v28" '+L+'/><circle cx="100" cy="36" r="14" fill="#fff" opacity=".85"/>',
 scarf:'<path d="M40 36q60 34 120 0l6 28q-66 36-132 0z"/><path d="M52 62l-6 66h30l8-48zM148 62l6 66h-30l-8-48z" '+D+'/><path d="M46 128h30M124 128h30" '+L+'/><path d="M60 50q40 20 80 0M52 74q50 24 100 0" '+L+'/>'
};
function pic(p){if(p.img)return '<div class="pic"><img src="'+p.img+'" alt="'+p.n+'" style="width:100%;height:100%;object-fit:cover">'+(p.o?'<span class="tag">−'+Math.round(100-p.p/p.o*100)+'%</span>':'')+'</div>';return '<div class="pic" style="background:'+p.bg+'"><svg viewBox="0 0 200 150" style="color:'+p.col+'" aria-hidden="true"><ellipse cx="100" cy="140" rx="52" ry="5" fill="#000" opacity=".1"/><g fill="'+p.col+'">'+SH[p.k]+'</g></svg>'+(p.o?'<span class="tag">−'+Math.round(100-p.p/p.o*100)+'%</span>':'')+'</div>'}
var cart=[],KEY="marina_cart",sizes={};
try{cart=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){cart=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}}
function $(i){return document.getElementById(i)}
function g(id){return P.find(function(p){return p.id===id})}
function inCart(id){return cart.some(function(x){return x.id===id})}
function fmt(n){return n.toLocaleString("uk-UA")+" ₴"}
function render(){
  var c=$("cat").value,sale=$("saleOnly").checked,only=$("inCartOnly").checked;
  var list=P.filter(function(p){return(!c||p.c===c)&&(!sale||p.o)&&(!only||inCart(p.id))});
  $("grid").innerHTML=list.length?list.map(function(p){
    var sz=sizes[p.id]||p.s[0],on=inCart(p.id);
    return '<article class="card">'+pic(p)+'<div class="info"><h3>'+p.n+'</h3><div class="sub">'+p.d+'</div><div class="price">'+fmt(p.p)+(p.o?'<s>'+fmt(p.o)+'</s>':'')+'</div>'+
    '<select class="sz" aria-label="Розмір" data-size="'+p.id+'">'+p.s.map(function(s){return '<option'+(s===sz?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
    '<label class="add'+(on?' on':'')+'"><input type="checkbox" data-add="'+p.id+'"'+(on?' checked':'')+'>'+(on?'В кошику':'Додати в кошик')+'</label></div></article>'}).join(''):'<p class="empty">Нічого не знайдено. Змініть фільтри.</p>';
  $("cnt").textContent=cart.reduce(function(s,x){return s+x.q},0);
}
$("grid").addEventListener("change",function(e){
  var t=e.target,id;
  if(t.dataset.size){id=+t.dataset.size;sizes[id]=t.value;var it=cart.find(function(x){return x.id===id});if(it){it.size=t.value;save()}return}
  if(t.dataset.add){id=+t.dataset.add;
    if(t.checked){if(!inCart(id))cart.push({id:id,q:1,size:sizes[id]||g(id).s[0]})}
    else cart=cart.filter(function(x){return x.id!==id});
    save();render()}
});
["cat","saleOnly","inCartOnly"].forEach(function(i){$(i).addEventListener("change",render)});
function total(){return cart.reduce(function(s,x){return s+x.q*g(x.id).p},0)}
function cartView(){
  $("dtitle").textContent="🛒 Кошик";
  if(!cart.length){$("dbody").innerHTML='<p class="empty">Кошик порожній. Позначте «Додати в кошик» біля товару.</p>';return}
  $("dbody").innerHTML=cart.map(function(x){var p=g(x.id);
    return '<div class="row"><div><strong>'+p.n+'</strong><br><small>Розмір: '+x.size+' · '+fmt(p.p)+'</small></div><strong>'+fmt(p.p*x.q)+'</strong>'+
    '<div class="q"><button type="button" data-m="'+x.id+'" aria-label="Менше">−</button><span>'+x.q+'</span><button type="button" data-p="'+x.id+'" aria-label="Більше">+</button></div>'+
    '<div><button class="btn ghost sm" type="button" data-d="'+x.id+'">Видалити</button></div></div>'}).join('')+
    '<div class="total"><span>Разом</span><span>'+fmt(total())+'</span></div>'+
    '<button class="btn" type="button" id="go">Оформити замовлення</button>'+
    '<button class="btn ghost" type="button" id="clr">Очистити кошик</button>';
}
function checkout(){
  $("dtitle").textContent="📦 Оформлення замовлення";
  $("dbody").innerHTML='<form id="frm" novalidate>'+
  '<div class="f"><label for="nm">Ваше ім’я *</label><input id="nm" type="text" autocomplete="name" placeholder="Іван Петренко"></div>'+
  '<div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="example@domain.com"></div>'+
  '<div class="f"><label for="ph">Телефон *</label><input id="ph" type="tel" autocomplete="tel" placeholder="+380123456789"></div>'+
  '<div class="f"><label for="ct">Місто *</label><input id="ct" type="text" autocomplete="address-level2" placeholder="Київ"></div>'+
  '<div class="f"><label for="ad">Адреса або відділення *</label><input id="ad" type="text" placeholder="Нова Пошта, відділення №5"></div>'+
  '<div class="lg">Спосіб доставки *</div><div class="opts"><label><input type="radio" name="dl" checked> Нова Пошта</label><label><input type="radio" name="dl"> Укрпошта</label><label><input type="radio" name="dl"> Кур’єр</label></div>'+
  '<div class="lg">Оплата *</div><div class="opts"><label><input type="radio" name="pay" checked> При отриманні</label><label><input type="radio" name="pay"> Карткою онлайн</label></div>'+
  '<div class="lg">Додаткові опції:</div><div class="opts"><label><input type="checkbox" id="gift"> 🎁 Подарункове пакування (+50 ₴)</label><label><input type="checkbox" id="agr"> Погоджуюсь з умовами обміну та повернення *</label></div>'+
  '<div class="f"><label for="cm">Коментар до замовлення</label><textarea id="cm" rows="2"></textarea></div>'+
  '<div class="err" id="err" role="alert"></div>'+
  '<div class="total"><span>До сплати</span><span id="sum">'+fmt(total())+'</span></div>'+
  '<button class="btn" type="submit">Підтвердити замовлення</button>'+
  '<button class="btn ghost" type="button" id="back">Назад до кошика</button></form>';
  $("gift").addEventListener("change",function(){$("sum").textContent=fmt(total()+(this.checked?50:0))});
}
function done(name,sum){
  cart=[];save();render();
  $("dtitle").textContent="✅ Готово";
  $("dbody").innerHTML='<div class="ok"><h2></h2><p>Замовлення на суму '+fmt(sum)+' прийнято. Ми зателефонуємо для підтвердження.</p><button class="btn" type="button" id="fin">Повернутися до магазину</button></div>';
  $("dbody").querySelector("h2").textContent="Дякуємо, "+name+"!";
}
$("dbody").addEventListener("click",function(e){
  var t=e.target,d=t.dataset;
  if(d.p||d.m||d.d){var id=+(d.p||d.m||d.d),it=cart.find(function(x){return x.id===id});
    if(d.p)it.q++;if(d.m)it.q=Math.max(1,it.q-1);if(d.d)cart=cart.filter(function(x){return x.id!==id});
    save();render();cartView();return}
  if(t.id==="go")checkout();
  if(t.id==="clr"){cart=[];save();render();cartView()}
  if(t.id==="back")cartView();
  if(t.id==="fin")$("dlg").close();
});
$("dbody").addEventListener("submit",function(e){
  e.preventDefault();
  var nm=$("nm").value.trim(),ph=$("ph").value.trim(),em=$("em").value.trim(),ct=$("ct").value.trim(),ad=$("ad").value.trim(),er=$("err");
  if(!nm||!ph||!ct||!ad){er.textContent="Заповніть ім’я, телефон, місто й адресу.";return}
  if(!/^\+?[0-9\s()-]{10,15}$/.test(ph)){er.textContent="Введіть телефон у форматі +380123456789.";return}
  if(em&&!/^\S+@\S+\.\S+$/.test(em)){er.textContent="Перевірте адресу електронної пошти.";return}
  if(!$("agr").checked){er.textContent="Потрібна згода з умовами обміну та повернення.";return}
  done(nm,total()+($("gift").checked?50:0));
});
$("open").addEventListener("click",function(){cartView();$("dlg").showModal()});
$("close").addEventListener("click",function(){$("dlg").close()});
render();
</script>
</body>
</html>
